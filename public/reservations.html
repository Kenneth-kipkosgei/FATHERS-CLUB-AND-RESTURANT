<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reserve a table — Fathers Club</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100">
  <style>
    header.nav-glow{transition:box-shadow 250ms ease,background-color 200ms ease}
    :root[data-theme='light'] header.nav-glow{box-shadow:0 8px 40px rgba(245,158,11,0.12)}
    :root[data-theme='dark'] header.nav-glow{box-shadow:0 8px 40px rgba(14,165,164,0.08)}
  </style>

  <header class="nav-glow bg-white/60 dark:bg-slate-800/40 border-b border-slate-200 dark:border-slate-700" aria-label="Main header">
    <div class="max-w-5xl mx-auto p-4 flex items-center justify-between">
      <h1 class="text-xl font-semibold uppercase tracking-wide text-slate-900 dark:text-slate-100">FATHERS CLUB &amp; RESTAURANT</h1>
      <nav class="flex items-center gap-4">
        <a class="text-slate-600 dark:text-slate-300 hover:text-black dark:hover:text-white" href="/">Home</a>
        <a class="text-slate-600 dark:text-slate-300 hover:text-black dark:hover:text-white" href="/menu.html">Menu</a>
        <a class="text-slate-600 dark:text-slate-300 hover:text-black dark:hover:text-white" href="/reservations.html">Reserve</a>
        <a class="text-slate-600 dark:text-slate-300 hover:text-black dark:hover:text-white" href="/admin.html">Admin</a>
        <button id="theme-toggle" aria-label="Toggle theme" class="ml-2 px-2 py-1 rounded border border-slate-200 dark:border-slate-700 text-sm bg-transparent">🌙</button>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-6">
    <h2 class="text-2xl font-bold mb-4">Reserve a table</h2>
    <section class="bg-slate-800 p-6 rounded">
      <form id="reservation-form" class="space-y-4">
        <div>
          <label class="block text-slate-300 mb-1" for="name">Your name</label>
          <input id="name" name="name" required class="w-full p-2 rounded bg-slate-700 border border-slate-600" />
        </div>

        <div>
          <label class="block text-slate-300 mb-1" for="phone">Phone</label>
          <input id="phone" name="phone" required class="w-full p-2 rounded bg-slate-700 border border-slate-600" />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-slate-300 mb-1" for="date">Date</label>
            <input id="date" name="date" type="date" required class="w-full p-2 rounded bg-slate-700 border border-slate-600" />
          </div>
          <div>
            <label class="block text-slate-300 mb-1" for="time">Time</label>
            <input id="time" name="time" type="time" required class="w-full p-2 rounded bg-slate-700 border border-slate-600" />
          </div>
        </div>

        <div>
          <label class="block text-slate-300 mb-1" for="guests">Guests</label>
          <select id="guests" name="guests" required class="w-full p-2 rounded bg-slate-700 border border-slate-600">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5+</option>
          </select>
        </div>

        <div>
          <label class="block text-slate-300 mb-1" for="notes">Notes (optional)</label>
          <textarea id="notes" name="notes" class="w-full p-2 rounded bg-slate-700 border border-slate-600"></textarea>
        </div>

        <div>
          <button type="submit" class="bg-amber-600 text-white px-4 py-2 rounded">Send Reservation</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="border-t border-slate-700 py-6 text-center text-slate-400">© Fathers Club & Restaurant</footer>

  <script src="/app.js"></script>
</body>
</html>
